[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshfind"
version = "0.1.0"
description = "Offline, end-to-end encrypted Find-My-style network for DIY BLE trackers over an ESP32 mesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7", "ziglang>=0.11"]

[project.scripts]
meshfind = "meshfind.cli:main"

[tool.setuptools]
packages = ["meshfind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
